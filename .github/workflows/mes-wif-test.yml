name: MES read-only identity test
on:
  push:
    branches: [mes-safety-test]
    paths: ['.github/workflows/mes-wif-test.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  identity-test:
    if: github.repository_id == '1197083974' && github.ref == 'refs/heads/mes-safety-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: auth
        name: Authenticate MES read-only service account
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/782401133060/locations/global/workloadIdentityPools/github-mes-audit/providers/github-mes-audit
          service_account: mes-audit-reader@dasanind-mes.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
      - name: Confirm authentication only
        run: |
          test -n "${{ steps.auth.outputs.access_token }}"
          echo "MES read-only identity authentication succeeded."
      - name: Read Firestore PITR and backup settings
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          DB_URL="https://firestore.googleapis.com/v1/projects/dasanind-mes/databases/%28default%29"
          curl -fsS -H "Authorization: Bearer ${ACCESS_TOKEN}" "${DB_URL}" > firestore-db-info.json
          echo "FIRESTORE_DATABASE_INFO"
          jq '{
            name,
            locationId,
            type,
            pointInTimeRecoveryEnablement,
            earliestVersionTime,
            versionRetentionPeriod,
            deleteProtectionState
          }' firestore-db-info.json

          LOCATION="$(jq -r '.locationId // empty' firestore-db-info.json)"
          if [ -n "${LOCATION}" ]; then
            BACKUPS_URL="https://firestore.googleapis.com/v1/projects/dasanind-mes/locations/${LOCATION}/backups"
            echo "FIRESTORE_BACKUPS"
            HTTP_CODE="$(curl -sS -o firestore-backups.json -w '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" "${BACKUPS_URL}")"
            echo "HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ]; then
              jq '{backupCount: ((.backups // []) | length), backups: [(.backups // [])[] | {name, state, database, databaseUid, snapshotTime, expireTime}]}' firestore-backups.json
            else
              cat firestore-backups.json
            fi
          fi
