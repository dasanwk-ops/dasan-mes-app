name: Prepare RC3 queue review (one time)
on:
  push:
    branches: [mes-safety-test]
    paths:
      - .github/workflows/prepare-rc3-review.yml
      - tools/prepare-rc3-review.py
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'dasanwk-ops/dasan-mes-app' && github.ref == 'refs/heads/mes-safety-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact test commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin https://github.com/dasanwk-ops/dasan-mes-app.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Apply baseline-guarded patch
        run: |
          python3 tools/prepare-rc3-review.py
          git diff --check
      - name: Synthetic tests and module syntax
        run: |
          node --test tests/*.test.mjs
          for file in src/*.mjs; do node --check "$file"; done
      - name: Store verified blobs only, without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'dasanwk-ops/dasan-mes-app'
          assert os.environ['GITHUB_REF'] == 'refs/heads/mes-safety-test'
          expected = {'src/App.js': '6b256917f6b9634e06c2fddf45c15db0424a03aa', 'tools/render-smoke.mjs': '56af8f425e3ba645c66b7fa8967546e3ea5114c8'}
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha, (name, actual)
              request = urllib.request.Request('https://api.github.com/repos/dasanwk-ops/dasan-mes-app/git/blobs', data=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha
              print('RC3_BLOB', name, result['sha'])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(name + ': `' + result['sha'] + '`\n\n')
          PY
