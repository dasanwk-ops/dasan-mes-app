name: MES encrypted daily backup trigger

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mes-encrypted-daily-backup.yml"

permissions:
  contents: read
  actions: write

jobs:
  trigger-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch backup worker on authorized branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mes-encrypted-backup-worker.yml/dispatches"             -d '{"ref":"mes-safety-test"}'
          echo "Encrypted MES backup worker dispatched."
