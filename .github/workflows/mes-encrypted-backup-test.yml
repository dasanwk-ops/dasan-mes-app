name: MES encrypted backup test

on:
  push:
    branches: [mes-safety-test]
    paths:
      - ".github/workflows/mes-encrypted-backup-test.yml"
      - "tools/export-firestore-full.mjs"
      - "backup/MES_BACKUP_PUBLIC_KEY.pem"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate read-only MES service account
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/782401133060/locations/global/workloadIdentityPools/github-mes-audit/providers/github-mes-audit
          service_account: mes-audit-reader@dasanind-mes.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s

      - name: Export complete Firestore document tree
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIRESTORE_PROJECT_ID: dasanind-mes
        run: |
          set -euo pipefail
          mkdir -p backup-output
          node tools/export-firestore-full.mjs backup-output/plaintext.json

      - name: Encrypt backup
        run: |
          set -euo pipefail
          STAMP="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          PREFIX="MES_backup_${STAMP}"
          openssl rand -base64 48 > backup-pass.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt             -in backup-output/plaintext.json             -out "backup-output/${PREFIX}.json.enc"             -pass file:backup-pass.txt
          openssl pkeyutl -encrypt -pubin             -inkey backup/MES_BACKUP_PUBLIC_KEY.pem             -in backup-pass.txt             -out "backup-output/${PREFIX}.passkey.enc"             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256
          sha256sum "backup-output/${PREFIX}.json.enc" "backup-output/${PREFIX}.passkey.enc"             > "backup-output/${PREFIX}.sha256.txt"
          printf '%s\n' "${PREFIX}" > backup-output/BACKUP_NAME.txt
          rm -f backup-output/plaintext.json backup-pass.txt
          test ! -e backup-output/plaintext.json
          test ! -e backup-pass.txt

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: MES-encrypted-backup-${{ github.run_number }}
          path: backup-output/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
