name: Verify hardened web delivery
on:
  push:
    branches: [security/mes-access-review-20261112]
    paths: [.github/workflows/verify-web-delivery-once.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository_id == '1197083974' && github.ref == 'refs/heads/security/mes-access-review-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public HTML and static assets without credentials
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const host = 'https://dasan-mes-app.vercel.app';
          const get = url => fetch(url, {redirect:'manual', signal:AbortSignal.timeout(10000)});
          (async()=>{
            let home;
            for(let i=0;i<20;i++){
              home=await get(host+'/?security_verification='+Date.now());
              if(home.status===200 && /noindex/.test(home.headers.get('x-robots-tag')||'')) break;
              await home.arrayBuffer();
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
            assert.equal(home.status,200);
            const html=await home.text();
            const report={};
            for(const [name,pattern] of Object.entries({
              'x-robots-tag':/noindex/,
              'x-content-type-options':/^nosniff$/,
              'x-frame-options':/^DENY$/,
              'referrer-policy':/^strict-origin-when-cross-origin$/,
              'content-security-policy':/frame-ancestors 'none'/
            })) {assert.match(home.headers.get(name)||'',pattern);report[name]=true;}
            assert.match(html,/name="robots"[^>]*noindex/);
            assert.match(html,/id="root"/);
            const scriptPath=html.match(/src="([^"]*\/static\/js\/[^\"]+\.js)"/)?.[1];
            assert(scriptPath);
            const script=await get(new URL(scriptPath,host));assert.equal(script.status,200);
            const code=await script.text();
            assert.doesNotMatch(code,/(?:\/\/#|\/\*#)\s*sourceMappingURL=/);
            const manifestResponse=await get(host+'/asset-manifest.json');assert.equal(manifestResponse.status,200);
            const manifest=await manifestResponse.json();
            assert(Object.values(manifest.files||{}).length>0);
            assert(Object.values(manifest.files||{}).every(file=>!String(file).endsWith('.map')));
            const map=await get(new URL(scriptPath+'.map',host));
            const mapText=await map.text();let exposedMap=false;
            try {const j=JSON.parse(mapText);exposedMap=Array.isArray(j.sources)||Array.isArray(j.sourcesContent);} catch {}
            assert.equal(exposedMap,false);
            const direct=await get(host+'/?step=step9');assert.equal(direct.status,200);
            assert.match(direct.headers.get('x-robots-tag')||'',/noindex/);await direct.arrayBuffer();
            console.log('DELIVERY_VERIFIED='+JSON.stringify({headers:report,htmlNoindex:true,appShellAvailable:true,scriptAvailable:true,manifestContainsNoSourceMaps:true,newSourceMapExposed:false,directRouteNoindex:true}));
            console.log('Only website/static asset GETs performed. No Firebase, records, accounts, print jobs, or Apps Script calls. This check does not assert database authorization.');
          })().catch(e=>{console.error('Web delivery verification failed: '+e.message);process.exit(1);});
          NODE
